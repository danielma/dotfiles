onboarding = false

[ui]
agent_panel_scope = "all"

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[theme]
name = "catppuccin"
# Follow the host terminal's appearance (kitty follows macOS; see
# ../kitty/*-theme.auto.conf). Requires herdr >= 0.9.0.
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

# Cmd bindings assume herdr runs in kitty (see ../kitty/kitty.conf). Ghostty
# claims these keys itself, so in Ghostty these actions have no shortcut.
# Everything not listed keeps its ctrl+b prefix default.
[keys]
toggle_sidebar = "cmd+b"
new_tab = "cmd+t"
switch_tab = ["cmd+1..9", "ctrl+1..9"]
# Kitty may report these as either the shifted symbol or shift+bracket, so
# bind both spellings.
next_tab = ["cmd+}", "cmd+shift+]"]
previous_tab = ["cmd+{", "cmd+shift+["]
next_agent = "cmd+]"
previous_agent = "cmd+["
close_pane = "cmd+w"
split_vertical = "cmd+d"
split_horizontal = "cmd+shift+d"
zoom = "cmd+shift+enter"
focus_pane_left = "cmd+alt+left"
focus_pane_right = "cmd+alt+right"
focus_pane_up = "cmd+alt+up"
focus_pane_down = "cmd+alt+down"
new_workspace = "cmd+n"
workspace_picker = "cmd+p"
open_notification_target = "cmd+o"
