# kitty is a dedicated host for herdr. Ghostty stays the general-purpose
# terminal; kitty exists so herdr can own the Cmd-key shortcuts without
# fighting Ghostty's defaults.

# Must come first: it drops every default mapping defined before it.
clear_all_shortcuts yes

# Login shell so herdr (and the agents it spawns) get the full PATH, even when
# kitty is launched from the Dock or Raycast.
shell /bin/zsh -lc "exec ~/.local/bin/herdr"

font_family Iosevka Nerd Font Mono

# Colors come from light-theme.auto.conf / dark-theme.auto.conf, which kitty
# swaps between as macOS changes appearance. Paint the titlebar with the
# current background so it blends into whichever one is active.
macos_titlebar_color background

# Herdr persists its own sessions, so closing the window loses nothing.
confirm_os_window_close 0
macos_quit_when_last_window_closed yes

# Let herdr see alt+... chords instead of macOS special characters.
macos_option_as_alt yes

# The only shortcuts kitty keeps. Every other Cmd key falls through to herdr.
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+q quit
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0
map cmd+ctrl+f toggle_fullscreen
map cmd+h hide_macos_app
map cmd+alt+h hide_macos_other_apps
map cmd+m minimize_macos_window
